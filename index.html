<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe8f2">
<title>Happy Birthday, Bubu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=dream1">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="progress" aria-hidden="true"><b id="bar"></b></div>

<!-- 1 · Welcome -->
<section id="s1" class="screen active">
  <div class="glass hero tilt">
    <p class="eyebrow reveal">A little surprise</p>
    <h1 class="reveal"><span>Happy</span> <em>Birthday</em></h1>
    <p class="name reveal" id="who"></p>
    <p class="lead reveal">Something special is waiting for you. Tap below to open it.</p>
    <button class="btn reveal" id="open"><span>Open your gift</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</section>

<!-- 2 · Cake -->
<section id="s2" class="screen">
  <div class="glass stage">
    <p class="eyebrow">Step 2 of 3</p>
    <h2>Make a wish</h2>
    <p class="lead">Close your eyes, then blow out the candle.</p>
    <div class="cake" id="cake" aria-label="Birthday cake">
      <svg viewBox="0 0 240 240" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9ac1"/><stop offset="1" stop-color="#e0407f"/></linearGradient>
          <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd0e2"/><stop offset="1" stop-color="#ff8fb8"/></linearGradient>
          <radialGradient id="gf" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#ffe27a"/><stop offset="1" stop-color="#ff8a00"/></radialGradient>
        </defs>
        <ellipse cx="120" cy="226" rx="104" ry="9" fill="#e0407f" opacity=".18"/>
        <rect x="16" y="150" width="208" height="74" rx="16" fill="url(#g1)"/>
        <path d="M16 166q13 24 26 0t26 0 26 0 26 0 26 0 26 0 26 0 26 0v-6a16 16 0 0 0-16-16H32a16 16 0 0 0-16 16z" fill="#fff"/>
        <rect x="52" y="96" width="136" height="60" rx="14" fill="url(#g2)"/>
        <path d="M52 112q11 20 22 0t22 0 22 0 22 0 22 0 22 0v-4a14 14 0 0 0-14-14H66a14 14 0 0 0-14 14z" fill="#fff"/>
        <g fill="#7be0ff"><circle cx="48" cy="196" r="5"/><circle cx="92" cy="204" r="5"/><circle cx="148" cy="204" r="5"/><circle cx="192" cy="196" r="5"/></g>
        <g fill="#ffd54a"><circle cx="70" cy="136" r="4"/><circle cx="120" cy="140" r="4"/><circle cx="170" cy="136" r="4"/></g>
        <rect x="114" y="52" width="12" height="46" rx="4" fill="#fff"/>
        <path d="M114 62l12-8M114 74l12-8M114 86l12-8" stroke="#6ec1ff" stroke-width="5"/>
        <g class="flame"><path d="M120 14c14 16 14 28 0 36-14-8-14-20 0-36z" fill="url(#gf)"/></g>
      </svg>
      <span class="smoke" aria-hidden="true"></span>
    </div>
    <button class="btn" id="blow"><span>Blow the candle</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h11a3 3 0 1 0-3-3M4 14h15a3 3 0 1 1-3 3M4 19h7"/></svg></button>
  </div>
</section>

<!-- 3 · Message & gallery -->
<section id="s3" class="screen">
  <div class="wrap">
    <header class="final">
      <p class="eyebrow" id="ageLine">Your day</p>
      <h1 class="shine">Happy Birthday!</h1>
      <p class="name" id="who2"></p>
    </header>

    <article class="glass letter tilt">
      <div class="seal" aria-hidden="true">♥</div>
      <p id="msg" class="typed"></p>
    </article>

    <div class="stats" id="stats" aria-hidden="true">
      <div><b data-k="years">0</b><span>years of you</span></div>
      <div><b data-k="months">0</b><span>months of smiles</span></div>
      <div><b data-k="days">0</b><span>days of sunshine</span></div>
    </div>

    <div class="gallery-wrap" id="galleryWrap" hidden>
      <h2>Memories</h2>
      <div class="heart" id="photos"><div class="heart-core" aria-hidden="true"><span>♥</span><small id="who3"></small></div></div>
    </div>

    <button class="btn ghost" id="again"><span>Light it again</span></button>
  </div>
</section>

<div class="lightbox" id="lb" hidden><button aria-label="Close" id="lbx">×</button><img alt=""></div>

<script src="script.js?v=dream1"></script>
</body>
</html>
